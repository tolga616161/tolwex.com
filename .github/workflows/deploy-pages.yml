name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Prepare static export (no API routes)
        run: |
          mkdir -p /tmp/tolwex-api-backup
          if [ -d src/app/api ]; then mv src/app/api /tmp/tolwex-api-backup/api; fi
          if [ -d src/app/admin ]; then mv src/app/admin /tmp/tolwex-api-backup/admin; fi
          rm -f src/app/instagram/dashboard/page.tsx
          printf '%s\n' "import Link from 'next/link';" "export default function Page(){return (<div className='site-shell py-10'><h1 className='display text-3xl'>Hesap Kontrolü</h1><p className='muted mt-3'>WhatsApp üzerinden destek alın.</p><Link className='btn btn-primary mt-6 inline-flex' href='/instagram/connect'>Bağlantı sayfası</Link></div>)}" > src/app/instagram/dashboard/page.tsx
      - name: Build static site
        env:
          GITHUB_PAGES: "1"
          NEXT_PUBLIC_APP_URL: https://tolwex.com
        run: npm run build
      - name: Ensure CNAME
        run: |
          echo 'tolwex.com' > out/CNAME
          echo 'www.tolwex.com' >> out/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
